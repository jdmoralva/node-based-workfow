  <div class="page-shell">
    <header class="topbar">
      <div class="topbar__row topbar__row--utility">
        <div class="utility-left">
          <button class="icon-button" type="button" aria-label="Apps menu"><svg><use href="#icon-grid"></use></svg></button>
          <div class="brand" aria-label="risk_viewer"><span class="brand__mark"></span><span class="brand__name">RISK VIEWER</span></div>
        </div>
      </div>
      <div class="topbar__row topbar__row--breadcrumb">
        <nav class="breadcrumbs" aria-label="Breadcrumb">
          <a href="index.html" class="breadcrumbs__link" aria-label="Home"><svg><use href="#icon-home"></use></svg></a>
          <svg class="breadcrumbs__divider"><use href="#icon-arrow-right"></use></svg>
          <span class="breadcrumbs__current">Sign In</span>
        </nav>

      </div>
    </header>

    <aside class="sidebar" aria-label="Primary navigation">
      <div class="sidebar__stack">
        <a class="sidebar__action sidebar__action--active" href="applications.html" aria-label="Applications" aria-current="page"><svg><use href="#icon-grid"></use></svg></a>
      </div>
      <div class="sidebar__stack sidebar__stack--bottom">
        <button class="sidebar__ghost" type="button" aria-label="Profile"><svg><use href="#icon-user"></use></svg></button>
        <button class="sidebar__ghost" type="button" aria-label="Log out"><svg><use href="#icon-logout"></use></svg></button>
      </div>
    </aside>

    <main class="content">
      <section class="login-panel" aria-label="Internal user sign in">
        <div class="login-panel__header">
          <div class="hero-ribbon login-panel__ribbon"><span class="hero-ribbon__edge"></span><h1>SIGN IN</h1><span class="hero-ribbon__edge"></span></div>
          <p class="login-panel__support"></p>
        </div>

        <form class="login-form-card" novalidate>
          <div class="login-form-card__field">
            <label class="login-form-card__label" for="login-username">Username</label>
            <input class="login-form-card__input" id="login-username" name="username" type="text" autocomplete="username">
            <p class="login-form-card__feedback" data-field-feedback="username" data-required-message="Username is required." hidden></p>
          </div>

          <div class="login-form-card__field">
            <label class="login-form-card__label" for="login-password">Password</label>
            <input class="login-form-card__input" id="login-password" name="password" type="password" autocomplete="current-password">
            <p class="login-form-card__feedback" data-field-feedback="password" data-required-message="Password is required." hidden></p>
          </div>

          <div class="login-form-card__actions">
            <button class="import-button login-form-card__submit" type="submit">Sign In</button>
          </div>

          <p class="login-form-card__result" data-login-result data-placeholder-message="Frontend-only placeholder." hidden></p>
        </form>
      </section>
    </main>
  </div>

  <script type="module">
function bootstrapLoginPage(options = {}) {
  const root = options.root || document;
  const form = root.querySelector('.login-form-card');
  const result = root.querySelector('[data-login-result]');
  const username = root.querySelector('#login-username');
  const password = root.querySelector('#login-password');
  const usernameFeedback = root.querySelector('[data-field-feedback="username"]');
  const passwordFeedback = root.querySelector('[data-field-feedback="password"]');

  if (!form || !result || !username || !password || !usernameFeedback || !passwordFeedback) {
    return {
      status: 'missing-form',
    };
  }

  function showFeedback(field, feedback) {
    feedback.textContent = feedback.dataset.requiredMessage || '';
    feedback.hidden = false;
    field.classList.add('login-form-card__input--invalid');
  }

  function clearFeedback(field, feedback) {
    feedback.hidden = true;
    feedback.textContent = '';
    field.classList.remove('login-form-card__input--invalid');
  }

  function validateField(field, feedback) {
    if (field.value.trim()) {
      clearFeedback(field, feedback);
      return true;
    }

    showFeedback(field, feedback);
    return false;
  }

  function hideResult() {
    result.hidden = true;
    result.textContent = '';
  }

  function handleFieldInput(event) {
    const field = event.currentTarget;
    if (field === username && field.value.trim()) {
      clearFeedback(username, usernameFeedback);
    }
    if (field === password && field.value.trim()) {
      clearFeedback(password, passwordFeedback);
    }
    hideResult();
  }

  function handleSubmit(event) {
    event.preventDefault();

    const usernameValid = validateField(username, usernameFeedback);
    const passwordValid = validateField(password, passwordFeedback);

    if (!usernameValid || !passwordValid) {
      hideResult();
      return;
    }

    result.textContent = result.dataset.placeholderMessage || '';
    result.hidden = !result.textContent;
  }

  form.addEventListener('submit', handleSubmit);
  username.addEventListener('input', handleFieldInput);
  password.addEventListener('input', handleFieldInput);

  return {
    status: 'ready',
    destroy() {
      form.removeEventListener('submit', handleSubmit);
      username.removeEventListener('input', handleFieldInput);
      password.removeEventListener('input', handleFieldInput);
    },
  };
}

const pageBootstrapRegistry = { 'login-page': bootstrapLoginPage };
function readBootstrapKey(root) {
  return root.dataset.pageBootstrap || '';
}

function bootstrapPage(root) {
  const pageBootstrapKey = readBootstrapKey(root);
  if (!pageBootstrapKey) {
    return null;
  }

  const bootstrapAdapter = pageBootstrapRegistry[pageBootstrapKey];
  if (!bootstrapAdapter) {
    throw new Error(`Unknown PageBootstrapRegistry key: ${pageBootstrapKey}`);
  }

  return bootstrapAdapter({ root });
}

window.pageBootstrap = bootstrapPage(document.body);
  </script>
</body>
</html>
