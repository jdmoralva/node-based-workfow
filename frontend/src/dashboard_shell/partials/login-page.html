      <section class="login-panel" aria-label="{{ARIA_LABEL}}">
        <div class="login-panel__header">
          <div class="hero-ribbon login-panel__ribbon"><span class="hero-ribbon__edge"></span><h1>{{TITLE}}</h1><span class="hero-ribbon__edge"></span></div>
          <p class="login-panel__support">{{SUPPORT_TEXT}}</p>
        </div>

        <form class="login-form-card" novalidate>
          <div class="login-form-card__field">
            <label class="login-form-card__label" for="login-username">{{USERNAME_LABEL}}</label>
            <input class="login-form-card__input" id="login-username" name="username" type="text" autocomplete="username">
            <p class="login-form-card__feedback" data-field-feedback="username" data-required-message="{{USERNAME_REQUIRED_MESSAGE}}" hidden></p>
          </div>

          <div class="login-form-card__field">
            <label class="login-form-card__label" for="login-password">{{PASSWORD_LABEL}}</label>
            <input class="login-form-card__input" id="login-password" name="password" type="password" autocomplete="current-password">
            <p class="login-form-card__feedback" data-field-feedback="password" data-required-message="{{PASSWORD_REQUIRED_MESSAGE}}" hidden></p>
          </div>

          <div class="login-form-card__actions">
            <button class="import-button login-form-card__submit" type="submit">{{SUBMIT_LABEL}}</button>
          </div>

          <p class="login-form-card__result" data-login-result data-placeholder-message="{{PLACEHOLDER_MESSAGE}}" hidden></p>
        </form>
      </section>
